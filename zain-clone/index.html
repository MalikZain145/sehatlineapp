<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zain Clone — SehatLine Project Guide</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c232c; --border:#2a3441;
    --text:#e6edf3; --muted:#8b98a5; --accent:#0bAA9d; --accent2:#12d3c0;
    --user:#0b6b63; --bot:#1c232c; --danger:#f85149; --chip:#22303c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); display:flex; height:100vh; overflow:hidden;
  }
  /* ---------- Sidebar ---------- */
  #sidebar{
    width:270px; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; flex-shrink:0; transition:margin-left .25s ease;
  }
  .brand{padding:16px 16px 10px; display:flex; gap:10px; align-items:center;}
  .brand .logo{
    width:38px;height:38px;border-radius:11px;flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#04231f;font-size:18px;
  }
  .brand h1{font-size:15px;margin:0;line-height:1.1;}
  .brand small{color:var(--muted);font-size:11px;}
  .newchat{
    margin:6px 12px 10px; padding:11px 12px; border:1px solid var(--border); border-radius:10px;
    background:var(--panel2); color:var(--text); cursor:pointer; font-size:14px; font-weight:600;
    display:flex;align-items:center;gap:8px;
  }
  .newchat:hover{border-color:var(--accent);}
  .hist-title{padding:6px 18px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;}
  #history{flex:1;overflow-y:auto;padding:0 8px;}
  .hist-item{
    padding:9px 11px;margin:2px 0;border-radius:8px;cursor:pointer;font-size:13px;
    color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:6px;
  }
  .hist-item:hover{background:var(--panel2);color:var(--text);}
  .hist-item.active{background:var(--panel2);color:var(--text);}
  .hist-item .del{opacity:0;color:var(--muted);}
  .hist-item:hover .del{opacity:1;}
  .hist-item .del:hover{color:var(--danger);}
  .side-foot{padding:10px 12px;border-top:1px solid var(--border);}
  .clearall{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;}
  .clearall:hover{border-color:var(--danger);color:var(--danger);}
  /* ---------- Main ---------- */
  #main{flex:1;display:flex;flex-direction:column;min-width:0;}
  #topbar{
    height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);
  }
  #menuBtn{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;}
  #topbar .who{flex:1;min-width:0;}
  #topbar .who b{font-size:14px;}
  #topbar .who span{display:block;color:var(--muted);font-size:11px;}
  .langsel{display:flex;background:var(--panel2);border:1px solid var(--border);border-radius:9px;overflow:hidden;}
  .langsel button{background:none;border:none;color:var(--muted);padding:7px 10px;font-size:12px;cursor:pointer;}
  .langsel button.active{background:var(--accent);color:#04231f;font-weight:700;}
  #chat{flex:1;overflow-y:auto;padding:22px 0;}
  .wrap{max-width:820px;margin:0 auto;padding:0 18px;}
  .msg{display:flex;gap:12px;margin-bottom:22px;align-items:flex-start;}
  .msg .av{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
  .msg.bot .av{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04231f;}
  .msg.user .av{background:#30363d;color:var(--text);}
  .bubble{padding:2px 2px;line-height:1.65;font-size:15px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;flex:1;}
  .msg.user .bubble{color:#dbe7ee;}
  .bubble code{background:#0b1016;border:1px solid var(--border);padding:1px 6px;border-radius:5px;font-size:13px;color:#9fe9df;font-family:Consolas,monospace;}
  .bubble .path{color:#9fe9df;font-family:Consolas,monospace;font-size:13.5px;}
  .again{margin-top:9px;}
  .again button{background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-size:12px;padding:6px 11px;border-radius:8px;cursor:pointer;}
  .again button:hover{border-color:var(--accent);color:var(--text);}
  .typing span{display:inline-block;width:7px;height:7px;margin-right:3px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
  /* suggestions */
  #suggest{max-width:820px;margin:0 auto;padding:6px 18px 0;display:flex;flex-wrap:wrap;gap:8px;}
  .chip{background:var(--chip);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:20px;font-size:12.5px;cursor:pointer;}
  .chip:hover{border-color:var(--accent);}
  /* input */
  #inputbar{border-top:1px solid var(--border);background:var(--panel);padding:14px 0;}
  .inrow{max-width:820px;margin:0 auto;padding:0 18px;display:flex;gap:10px;align-items:flex-end;}
  #inp{
    flex:1;resize:none;max-height:150px;min-height:24px;background:var(--panel2);border:1px solid var(--border);
    border-radius:14px;color:var(--text);padding:13px 15px;font-size:15px;font-family:inherit;line-height:1.4;outline:none;
  }
  #inp:focus{border-color:var(--accent);}
  #send{width:46px;height:46px;border-radius:12px;border:none;background:var(--accent);color:#04231f;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  #send:hover{background:var(--accent2);}
  .foot-note{max-width:820px;margin:6px auto 0;padding:0 18px;color:var(--muted);font-size:11px;text-align:center;}
  /* hero */
  .hero{text-align:center;padding:40px 18px 10px;}
  .hero .big{width:70px;height:70px;border-radius:20px;margin:0 auto 14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#04231f;}
  .hero h2{margin:0 0 6px;font-size:22px;}
  .hero p{color:var(--muted);margin:0 auto;max-width:520px;font-size:14px;}
  [dir="rtl"],.rtl{font-family:'Segoe UI','Noto Nastaliq Urdu',system-ui,sans-serif;}
  @media(max-width:760px){
    #sidebar{position:fixed;z-index:30;height:100%;margin-left:-270px;}
    #sidebar.open{margin-left:0;box-shadow:0 0 40px rgba(0,0,0,.6);}
    #menuBtn{display:block;}
    #backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:29;}
    #backdrop.show{display:block;}
  }
</style>
</head>
<body>
  <div id="backdrop" onclick="toggleSidebar(false)"></div>

  <aside id="sidebar">
    <div class="brand">
      <div class="logo">Z</div>
      <div><h1>Zain Clone</h1><small>SehatLine Project Guide</small></div>
    </div>
    <button class="newchat" onclick="newChat()">＋ New chat</button>
    <div class="hist-title">History</div>
    <div id="history"></div>
    <div class="side-foot">

    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <button id="menuBtn" onclick="toggleSidebar()">☰</button>
      <div class="who">
        <b>Muhammad Zain Ul Abideen</b>

      </div>

    <div id="chat"></div>

    <div id="suggest"></div>

    <div id="inputbar">
      <div class="inrow">
        <textarea id="inp" rows="1" placeholder="Sawal likho… (English / Roman Urdu / اردو)"></textarea>
        <button id="send" onclick="onSend()">➤</button>
      </div>
      <div class="foot-note">Offline knowledge engine — SehatLine ke asli code par based. Chats sirf is browser (localStorage) mein save hoti hain.</div>
    </div>
  </main>

      "SehatLine is a hospital queue-management app for Pakistan (CDA Hospital demo). It has 5 role portals in ONE app: Patient, Doctor, Admin, Pharmacy and Laboratory.\nFlow: a patient books an appointment or a Chronic-OPD token → the doctor sees them and forwards them to the Pharmacy → after medicines, the patient goes to the Laboratory for tests. Everything is live (Socket.IO) and backed by a real Node + MongoDB backend.",

      "Aasan lafzon mein: SehatLine hospital ka digital token system hai. Patient line mein khare nahi hote — app se book karte hain aur apni baari live dekhte hain. Doctor, pharmacy, lab, admin — sab ke apne screens hain, sab ek backend aur ek database se jure hue."

  tags:["tech stack","technologies","kaunsi technology","konsi technology","language use","framework","stack","kis cheez se bana","tools","kया technology","ٹیکنالوجی","کس چیز سے","kaun si tech","react node"],
  a:{
    en:[
      "Tech stack:\n• Frontend: React Native + Expo (SDK 54) — one codebase for the whole mobile app.\n• Backend: Node.js + Express (REST API).\n• Database: MongoDB with Mongoose (models/schemas).\n• Real-time: Socket.IO (live queue updates).\n• Auth: JWT tokens + bcrypt password hashing.\n• Extras: Zod validation, Helmet + CORS + rate-limit for security, tesseract.js for CNIC OCR, node-cron for scheduled jobs.\n• Hosting: backend on Vercel (serverless), database on MongoDB Atlas, mobile app built as an APK via EAS."

    ]
  }

{
  id:"architecture",
  tags:["architecture","folder structure","structure","files kaise","kaise arrange","organize","folders","file structure","backend structure","ڈھانچہ","سٹرکچر","folder","directory"],
  a:{
    en:[
      "The project has two parts: frontend/ (the app) and backend/ (the server).\nBackend is modular — backend/src/modules/ has one folder per role: auth, patient, doctor, admin, pharmacy, laboratory. Each module has its own controllers/ (logic), routes/ (URLs), and models/ (database shapes).\nKey backend files: src/app.js (sets up Express + mounts all routes), src/server.js (starts it), src/config/db.js (connects MongoDB), src/config/env.js (settings), src/middleware/ (auth guard, validation, security).\nFrontend mirrors it: frontend/src/modules/<role>/screens + services (the service files call the backend)."
    ],
    ru:[
      "Project ke do hisse hain: frontend/ (app) aur backend/ (server).\nBackend modular hai — backend/src/modules/ mein har role ka apna folder: auth, patient, doctor, admin, pharmacy, laboratory. Har module ke andar controllers/ (logic), routes/ (URLs) aur models/ (database ki shape).\nAsli backend files: src/app.js (Express set-up + saare routes mount), src/server.js (start karta hai), src/config/db.js (MongoDB connect), src/config/env.js (settings), src/middleware/ (auth guard, validation, security).\nFrontend bhi aise hi: frontend/src/modules/<role>/screens + services (service files backend ko call karti hain)."
    ],
    ur:[
      "پروجیکٹ کے دو حصے: frontend/ (ایپ) اور backend/ (سرور)۔\nبیک اینڈ ماڈیولر ہے — backend/src/modules/ میں ہر رول کا فولڈر: auth, patient, doctor, admin, pharmacy, laboratory۔ ہر ماڈیول میں controllers (لاجک)، routes (یو آر ایل) اور models (ڈیٹابیس شکل)۔\nاہم فائلیں: src/app.js، src/server.js، src/config/db.js، src/config/env.js، src/middleware/۔"
    ]
  }
},
{
  id:"login",
  tags:["login","log in","signin","sign in","login kaise","login ksy","login kese","how login","login work","login flow","login route","login function","login kam","authenticate","how does login","لاگ ان","لاگ اِن","login ka","password check"],
  a:{
    en:[
      "LOGIN — full journey (step by step):\n\n1) FRONTEND: On the Login screen you type email/phone + password. The screen calls login() in\n   frontend/src/modules/auth/services/authService.js\n   which runs: api.post('/auth/login', { emailOrPhone, password }).\n\n2) apiClient (frontend/src/services/apiClient.js) does fetch(baseURL + '/auth/login'). The baseURL comes from src/config/api.config.js (auto-detects your PC's IP in dev, or the hosted Vercel URL in the APK).\n\n3) ROUTE (backend): app.js mounts app.use('/api/auth', authRoutes). Inside\n   backend/src/modules/auth/routes/auth.routes.js →\n   router.post('/login', authLimiter, validate(loginSchema), authController.login).\n\n4) CONTROLLER: the login() function in\n   backend/src/modules/auth/controllers/auth.controller.js does the real work:\n   • User.findOne({ email or phone }).select('+password')  → fetch the user from MongoDB\n   • user.comparePassword(password) → bcrypt.compare(typed, hashed) checks the password\n   • checks accountStatus (suspended/deactivated)\n   • createSession(user) → makes a JWT token (jwt.sign)\n   • returns { success:true, token, user: user.toSafeJSON() }.\n\n5) DATABASE: the User model (backend/src/modules/auth/models/User.js) is a Mongoose schema. The password is never stored plain — a pre-save hook bcrypt-hashes it. Connection is made in src/config/db.js (mongoose.connect to MONGO_URI).\n\n6) BACK IN THE APP: the token is saved; every later request sends header Authorization: Bearer <token>, and middleware/auth.middleware.js (authGuard) verifies it to protect the other screens.\n\nOne line: screen → authService.login → api.post('/auth/login') → route → auth.controller.login → User model (bcrypt check) → JWT token back.",

      "Let me explain login more simply, like a story:\n\nSocho login ek darbaan (guard) hai. \n• You (app) knock with your email + password — that's authService.login() sending api.post('/auth/login').\n• The knock reaches the door address /api/auth/login (the ROUTE in auth.routes.js).\n• Behind the door sits the guard = the login() function in auth.controller.js.\n• The guard opens the register (MongoDB, User model), finds your name with User.findOne, and checks your password with bcrypt.compare (comparePassword). Passwords are stored hashed, so even the guard never sees the real password.\n• If it matches, the guard gives you a stamped pass = a JWT token (createSession → jwt.sign).\n• From then on you show that pass (Authorization: Bearer token) and authGuard lets you into the other rooms (screens).\nThat's the whole login.",

      "Login in 4 boxes — remember these names for the viva:\n• WHERE it starts: authService.js → login() → api.post('/auth/login').\n• WHICH URL/route: /api/auth/login  (defined in auth.routes.js).\n• WHICH function does the work: login() in auth.controller.js.\n• HOW the DB is used: User model (Mongoose) → User.findOne() to get the user, comparePassword() (bcrypt) to verify, then a JWT token is returned.\nProtected pages afterwards are guarded by auth.middleware.js (checks the Bearer token). If anyone asks 'how is it linked to the DB' → answer: through the Mongoose User model and mongoose.connect() in config/db.js."
    ],
    ru:[

      "Chalo login ko aur aasan, kahani ki tarah samjhata hoon:\n\nSocho login ek darbaan hai.\n• Tum (app) email + password ke saath darwaza khatkhataate ho — yeh authService.login() hai jo api.post('/auth/login') bhejta hai.\n• Khatkhataana pahunchta hai pate par /api/auth/login (ROUTE, auth.routes.js mein).\n• Darwaze ke peechhe darbaan baitha hai = login() function (auth.controller.js).\n• Darbaan register kholta hai (MongoDB, User model), User.findOne se tumhara naam dhoondta hai, aur bcrypt.compare (comparePassword) se password milata hai. Password hashed store hota hai, is liye darbaan ko bhi asli password nazar nahi aata.\n• Match ho gaya to darbaan tumhe ek stamp-shuda pass deta hai = JWT token (createSession → jwt.sign).\n• Uske baad tum wohi pass dikhaate ho (Authorization: Bearer token) aur authGuard tumhe baaqi kamron (screens) mein jaane deta hai.\nBas yehi poora login hai.",

  a:{
    en:[
      "Three backend building blocks:\n• CONTROLLER = the brain/logic. A function that receives the request, does the work (read/write DB, checks) and sends the response. e.g. login() in auth.controller.js.\n• MODEL = the shape of data in MongoDB, written with Mongoose (a schema). e.g. User model defines name, email, password… and methods like comparePassword. Controllers use models to talk to the database.\n• MIDDLEWARE = a checkpoint that runs BEFORE the controller — e.g. authGuard (is the token valid?), validate (is the input correct?), rate-limit (too many requests?). If a checkpoint fails, the request is stopped there.\nSo: route → middleware → controller → model → database."
    ],
    ru:[
      "Backend ke teen building blocks:\n• CONTROLLER = dimaag/logic. Ek function jo request leta hai, kaam karta hai (DB parhna/likhna, checks) aur response bhejta hai. Jaise login() (auth.controller.js).\n• MODEL = MongoDB mein data ki shape, Mongoose se likhi (schema). Jaise User model naam, email, password… aur comparePassword jaise methods define karta hai. Controllers models se database se baat karte hain.\n• MIDDLEWARE = checkpoint jo controller se PEHLE chalta hai — jaise authGuard (token sahi hai?), validate (input theek hai?), rate-limit (zyada requests to nahi?). Checkpoint fail ho to request wahin ruk jaati hai.\nYaani: route → middleware → controller → model → database."

/* ---- Greeting intent (handled separately for a warm opener) ---- */
const GREET = {
  en:"Assalam-o-alaikum! I am Muhammad Zain Ul Abideen, Clone of Zain Bhai. Ask me anything about the SehatLine project — login, routes, database, modules — in English, Roman Urdu or Urdu. Where should we start?",

  ur:"السلام علیکم! میں محمد زین العابدین ہوں، زین بھائی کا کلون۔ سہت لائن پروجیکٹ کے بارے میں کچھ بھی پوچھو — لاگ اِن، روٹس، ڈیٹابیس، ماڈیولز — انگریزی، رومن اردو یا اردو میں۔ کہاں سے شروع کریں؟"
};

const FALLBACK = {
  en:"I didn't catch that exactly. I'm the SehatLine project guide — try asking about login, signup, routes, controllers, the database, JWT, Socket.IO, the 5 modules, appointments, or hosting. Or tap a suggestion below.",
  ru:"Yeh theek se samajh nahi aaya. Main SehatLine project ka guide hoon — login, signup, routes, controllers, database, JWT, Socket.IO, 5 modules, appointments ya hosting ke baare mein poochho. Ya neeche koi suggestion dabao.",
  ur:"یہ ٹھیک سے سمجھ نہیں آیا۔ میں سہت لائن پروجیکٹ کا گائیڈ ہوں — لاگ اِن، سائن اپ، روٹس، کنٹرولر، ڈیٹابیس، JWT، ماڈیولز یا ہوسٹنگ کے بارے میں پوچھو۔"
};

const SUGGEST = {
  en:["How does login work?","What is a route & controller?","How is the database connected?","Explain the 5 modules","What is JWT?","How is it hosted?"],
  ru:["Login kaise kaam karta hai?","Route aur controller kya hai?","Database kaise connect hai?","5 modules samjhao","JWT kya hai?","Hosting kaise hai?"],
  ur:["لاگ اِن کیسے چلتا ہے؟","روٹ اور کنٹرولر کیا ہے؟","ڈیٹابیس کیسے جڑا ہے؟","پانچ ماڈیولز","JWT کیا ہے؟","ہوسٹنگ کیسے ہے؟"]
};

/* =========================== ENGINE =============================== */
let uiLang = "auto";                 // auto | en | ru | ur
let variantIdx = {};                 // per-intent variant rotation
let chats = [];                      // all conversations
let curId = null;                    // current chat id

const $ = s => document.querySelector(s);
const chatEl = $("#chat"), inp = $("#inp");

/* Roman-Urdu detector words */
const RU_WORDS = ["kaise","kese","ksy","kaunsa","konsa","kya","kyu","kyun","kaam","kam","hai","hota","rha","raha","kro","karo","batao","samjha","samjhao","poocho","poochu","mein","kaha","kahan","ka","ki","ke","tum","aap","kon","kaun","nahi","acha","theek","bhai","yeh","wo","ho","krta","krna","dede","dedo","chal","chalta"];

function detectLang(t){
  if(/[؀-ۿ]/.test(t)) return "ur";
  const low = " "+t.toLowerCase().replace(/[^a-z\s]/g," ")+" ";
  let hits=0; RU_WORDS.forEach(w=>{ if(low.includes(" "+w+" ")) hits++; });
  return hits>=1 ? "ru" : "en";
}
function replyLang(userText){ return uiLang==="auto" ? detectLang(userText) : uiLang; }

/* normalize for matching */
function norm(t){
  return " "+t.toLowerCase()
    .replace(/[^a-z0-9؀-ۿ\s]/g," ")
    .replace(/\s+/g," ").trim()+" ";
}
function scoreIntent(intent, nText){
  let s=0;
  intent.tags.forEach(tag=>{
    const tg = tag.toLowerCase().trim();
    if(!tg) return;
    if(tg.includes(" ")){ if(nText.includes(" "+tg+" ")||nText.includes(tg)) s+=2.2; }
    else { if(nText.includes(" "+tg+" ")) s+=1.4; else if(nText.includes(tg) && tg.length>3) s+=0.6; }
  });
  return s;
}
function findIntent(text){
  const n = norm(text);
  if(/^\s*(hi|hello|hey|salam|asalam|assalam|aoa|السلام|سلام|hy)\b/.test(n)) return {id:"__greet"};
  let best=null, bestScore=0;
  KB.forEach(it=>{ const sc=scoreIntent(it,n); if(sc>bestScore){bestScore=sc; best=it;} });
  return bestScore>=1 ? best : null;
}
function answerFor(intent, lang, advance){
  if(intent.id==="__greet") return GREET[lang]||GREET.en;
  const arr = (intent.a[lang]&&intent.a[lang].length)?intent.a[lang]:intent.a.en;
  if(variantIdx[intent.id]==null) variantIdx[intent.id]=0;   // record the baseline shown
  if(advance) variantIdx[intent.id]++;                        // move to the next variant
  const i = variantIdx[intent.id] % arr.length;
  const pick = arr[i];
  // "another way" prefix whenever we're re-explaining (rotated, or only one variant exists)
  if(advance && (i!==0 || arr.length===1)){
    const pre = {en:"Sure — another way to see it:\n\n", ru:"Theek hai — ek aur tareeqe se:\n\n", ur:"ٹھیک ہے — ایک اور طرح سے:\n\n"}[lang]||"";
    return pre+pick;
  }
  return pick;
}

/* =========================== UI =============================== */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(s){
  // bold **x**, inline paths, code words already fine; convert newlines
  let h = esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  h = h.replace(/(\/api\/[^\s,)]+|[a-zA-Z0-9_.\/-]+\.(?:js|ts|tsx|json))/g,'<span class="path">$1</span>');
  return h.replace(/\n/g,"<br>");
}
function addMsg(role,text,lang,intentId){
  const isUr = lang==="ur";
  const wrap=document.createElement("div"); wrap.className="wrap";
  const m=document.createElement("div"); m.className="msg "+role;
  const av=document.createElement("div"); av.className="av"; av.textContent= role==="bot"?"Z":"🧑";
  const b=document.createElement("div"); b.className="bubble"; if(isUr){b.classList.add("rtl");b.setAttribute("dir","rtl");} else b.setAttribute("dir","auto");
  b.innerHTML=fmt(text);
  m.appendChild(av); m.appendChild(b); wrap.appendChild(m);
  if(role==="bot" && intentId && intentId!=="__greet" && intentId!=="__fallback"){
    const again=document.createElement("div"); again.className="again";
    const btn=document.createElement("button");
    btn.textContent = lang==="ur"?"↺ ایک اور طرح سے سمجھاؤ" : lang==="ru"?"↺ Aur tareeqe se samjhao":"↺ Explain differently";
    btn.onclick=()=>{ const t=answerFor(KB.find(k=>k.id===intentId),lang,true); addMsg("bot",t,lang,intentId); persist("bot",t,lang,intentId); scrollDown(); };
    again.appendChild(btn); b.appendChild(again);
  }
  chatEl.appendChild(wrap);
}
function typing(){
  const wrap=document.createElement("div"); wrap.className="wrap"; wrap.id="typingRow";
  wrap.innerHTML='<div class="msg bot"><div class="av">Z</div><div class="bubble typing"><span></span><span></span><span></span></div></div>';
  chatEl.appendChild(wrap); scrollDown();
}
function stopTyping(){ const t=$("#typingRow"); if(t) t.remove(); }
function scrollDown(){ chatEl.scrollTop=chatEl.scrollHeight; }

function renderSuggest(){
  const lang = uiLang==="auto"?"en":uiLang;
  const box=$("#suggest"); box.innerHTML="";
  (SUGGEST[lang]||SUGGEST.en).forEach(q=>{
    const c=document.createElement("div"); c.className="chip"; c.textContent=q;
    c.onclick=()=>{ inp.value=q; onSend(); };
    box.appendChild(c);
  });
}

/* =========================== CHAT STORE =============================== */
function load(){ try{ chats=JSON.parse(localStorage.getItem("zc_chats")||"[]"); }catch(e){ chats=[]; } }
function save(){ try{ localStorage.setItem("zc_chats",JSON.stringify(chats)); }catch(e){} }
function cur(){ return chats.find(c=>c.id===curId); }
function persist(role,text,lang,intentId){
  const c=cur(); if(!c) return;
  c.messages.push({role,text,lang,intentId});
  if(role==="user" && (c.title==="New chat"||!c.title)) c.title=text.slice(0,38);
  save(); renderHistory();
}
function newChat(){
  curId="c"+Date.now();
  chats.unshift({id:curId,title:"New chat",messages:[]});
  save(); renderHistory(); renderChat(); toggleSidebar(false);
}
function openChat(id){ curId=id; renderChat(); toggleSidebar(false); }
function delChat(id,ev){ ev.stopPropagation(); chats=chats.filter(c=>c.id!==id); if(curId===id) curId=chats[0]?chats[0].id:null; if(!curId) newChat(); save(); renderHistory(); renderChat(); }
function clearAll(){ chats=[]; save(); newChat(); }

function renderHistory(){
  const h=$("#history"); h.innerHTML="";
  chats.forEach(c=>{
    const d=document.createElement("div"); d.className="hist-item"+(c.id===curId?" active":"");
    const t=document.createElement("span"); t.textContent=c.title||"New chat"; t.style.overflow="hidden"; t.style.textOverflow="ellipsis";
    const x=document.createElement("span"); x.className="del"; x.textContent="✕"; x.onclick=(e)=>delChat(c.id,e);
    d.appendChild(t); d.appendChild(x); d.onclick=()=>openChat(c.id);
    h.appendChild(d);
  });
}
function renderChat(){
  chatEl.innerHTML="";
  const c=cur();
  if(!c||c.messages.length===0){
    const hero=document.createElement("div"); hero.className="hero";
    hero.innerHTML='<div class="big">Z</div><h2>Muhammad Zain Ul Abideen</h2><p>Clone of Zain Bhai — I explain the SehatLine project code in English, Roman Urdu & Urdu. Poochho jo samajhna hai, main hoon na. 🙂</p>';
    const w=document.createElement("div"); w.className="wrap"; w.appendChild(hero); chatEl.appendChild(w);
  } else {
    c.messages.forEach(m=>addMsg(m.role,m.text,m.lang,m.intentId));
  }
  renderHistory(); renderSuggest(); scrollDown();
}

/* =========================== SEND =============================== */
function onSend(){
  const text=inp.value.trim(); if(!text) return;
  if(!cur()) newChat();
  const lang=replyLang(text);
  addMsg("user",text,lang); persist("user",text,lang);
  inp.value=""; inp.style.height="auto"; scrollDown();

  typing();
  setTimeout(()=>{
    stopTyping();
    const intent=findIntent(text);
    let out, iid, alang=lang;
    if(!intent){ out=(FALLBACK[lang]||FALLBACK.en); iid="__fallback"; }
    else {
      // rotate variant if the SAME intent was just asked again
      const c=cur(); const last=[...c.messages].reverse().find(m=>m.role==="bot" && m.intentId);
      const advance = last && last.intentId===intent.id;
      out=answerFor(intent,lang,advance); iid=intent.id;
    }
    addMsg("bot",out,alang,iid); persist("bot",out,alang,iid); scrollDown();
  }, 380+Math.random()*350);
}

function setLang(l){
  uiLang=l;
  document.querySelectorAll("#langsel button").forEach(b=>b.classList.toggle("active",b.dataset.l===l));
  renderSuggest();
}
function toggleSidebar(force){
  const sb=$("#sidebar"), bd=$("#backdrop");
  const open = force==null ? !sb.classList.contains("open") : force;
  sb.classList.toggle("open",open); bd.classList.toggle("show",open);
}

/* input auto-grow + Enter to send */
inp.addEventListener("input",()=>{ inp.style.height="auto"; inp.style.height=Math.min(inp.scrollHeight,150)+"px"; });
inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); onSend(); } });

/* boot */
load();
if(chats.length===0){ newChat(); } else { curId=chats[0].id; renderChat(); }
renderSuggest();
</script>
